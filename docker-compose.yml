version: '3.8'

services:
  portal-projetos:
    build: .
    container_name: portal_projetos
    restart: always
    ports:
      - "8501:8501"
    volumes:
      # Persiste o banco de dados SQLite no servidor host
      - ./projetos.db:/app/projetos.db
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
